server.port=8080
ollama.base-url=http://localhost:11434
ollama.chat-model=qwen3:4b
ollama.embedding-model=nomic-embed-text

# Base URL for your local Ollama instance
spring.ai.ollama.base-url=http://localhost:11434
# The specific model you downloaded via the CLI
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.7
# Optional: Automatically pull the model if it's missing on your machine
spring.ai.ollama.init.pull-model-strategy=when_missing
# Set the active embedding model
spring.ai.ollama.embedding.options.model=nomic-embed-text


# PGVector Store Configuration
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# PDF upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

app.ocr.tesseract-path=C:/Program Files/Tesseract-OCR/tesseract.exe
app.ocr.data-path=C:/Program Files/Tesseract-OCR/tessdata
app.ocr.language=eng
app.ocr.dpi=200